name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Action versions are pinned to the first major that declares
# runs.using: node24. The version number is not a reliable proxy for the
# runtime - upload-artifact@v5 still ran on Node 20, and v6 was the first Node
# 24 major. Check the upstream action.yml rather than assuming when bumping:
#   curl -s https://raw.githubusercontent.com/<owner>/<repo>/<tag>/action.yml \
#     | grep using:

jobs:
  msbuild:
    name: ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, Win32 ]
        configuration: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v3

      # No /warnaserror: it would apply to the lwext4 submodule as well, and
      # upstream is not warning-clean under MSVC /W3. Scope it to tclwext4's own
      # sources once they are.
      - name: Build
        run: >
          msbuild tclwext4.sln
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /m
          /v:minimal

      - name: Check plugin was produced
        shell: pwsh
        run: |
          $ext = if ('${{ matrix.platform }}' -eq 'x64') { 'wfx64' } else { 'wfx' }
          $out = "build/${{ matrix.platform }}/${{ matrix.configuration }}/tclwext4.$ext"
          if (-not (Test-Path $out)) { throw "missing $out" }
          Get-Item $out | Format-List Name, Length

      # NOT a release. Artifacts expire, require a GitHub login to fetch, and
      # exist so a contributor can confirm their change compiles - see the
      # "No binary releases" section of README.md.
      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-ci-build-${{ matrix.platform }}-${{ matrix.configuration }}
          path: build/${{ matrix.platform }}/${{ matrix.configuration }}/tclwext4.wfx*
          retention-days: 7
          if-no-files-found: error

  cmake:
    name: cmake x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Everything below tees into ci-logs/ and is uploaded as an artifact on
      # failure. The Actions web UI sometimes renders a bare "Error:" with no
      # expandable body; a downloadable log file is immune to that.
      - name: Toolchain versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          & {
            cmake --version
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              & $vswhere -products * -format value -property displayName
              & $vswhere -products * -format value -property installationVersion
            } else { "vswhere not found" }
            "--- submodule state ---"
            git submodule status
            if (Test-Path external/lwext4/src/ext4.c) { "lwext4 present" }
            else { "lwext4 ABSENT - CMake will clone it" }
          } 2>&1 | Tee-Object ci-logs/toolchain.txt

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/x64 -A x64 2>&1 | Tee-Object ci-logs/configure.txt
          if ($LASTEXITCODE -ne 0) { throw "configure failed with $LASTEXITCODE" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/x64 --config Release 2>&1 | Tee-Object ci-logs/build.txt
          if ($LASTEXITCODE -ne 0) { throw "build failed with $LASTEXITCODE" }

      - name: Check plugin was produced
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse -Path build/x64 -Filter tclwext4.wfx64 -ErrorAction SilentlyContinue
          if (-not $out) { throw "tclwext4.wfx64 not produced" }
          $out | Format-List FullName, Length

      - name: Collect CMake logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          foreach ($f in 'build/x64/CMakeFiles/CMakeConfigureLog.yaml',
                         'build/x64/CMakeFiles/CMakeError.log',
                         'build/x64/CMakeFiles/CMakeOutput.log',
                         'build/x64/CMakeCache.txt') {
            if (Test-Path $f) { Copy-Item $f ci-logs/ -Force }
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmake-ci-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn

  bootstrap-fallback:
    # Checks out WITHOUT submodules on purpose, to exercise the FetchLwext4
    # target in lwext4.vcxproj. This is the path that silently produced an empty
    # static library when .gitmodules existed with no gitlink in the index, so it
    # is worth a dedicated job rather than trusting it.
    name: submodule bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: microsoft/setup-msbuild@v3

      - name: Confirm lwext4 is absent before building
        shell: pwsh
        run: |
          if (Test-Path external/lwext4/src/ext4.c) {
            throw "lwext4 present - this job must start without it"
          }
          if (Test-Path external/fatfs/source/ff.c) {
            throw "fatfs present - this job must start without it"
          }

      - name: Build (must fetch lwext4 itself)
        run: msbuild tclwext4.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Confirm it fetched and linked
        shell: pwsh
        run: |
          if (-not (Test-Path external/lwext4/src/ext4.c)) { throw "lwext4 was not fetched" }
          if (-not (Test-Path external/fatfs/source/ff.c)) { throw "fatfs was not fetched" }
          if (-not (Test-Path build/x64/Release/tclwext4.wfx64)) { throw "plugin not built" }
